version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: https://api.yourdomain.com

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - '3001:3001'
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production