version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - '3001:3001'
    environment:
      MONGO_URI: mongodb://mongo:27017/myapp
      JWT_SECRET: mysecret
      NODE_ENV: development
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: